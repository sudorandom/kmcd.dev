{{- $cutoff := now.AddDate -2 0 0 -}}
<script type="text/javascript">
const allPages = [
{{- range (where .Site.RegularPages "Type" "posts") -}}
  {{- if and (not .IsHome) (ge .Date $cutoff) }}
  "{{ .Permalink }}",
  {{- end -}}
{{- end }}
];
const pages = allPages.length > 1 ? allPages.filter(p => p !== document.referrer) : allPages;
const randomIdx = Math.floor(Math.random() * pages.length);
window.location = pages[randomIdx];
</script>
