<div class="palette-switcher not-selectable" role="radiogroup" aria-label="Color Palette">
  <button type="button" class="palette-dot-btn" data-palette-target="monochrome" aria-label="Monochrome Palette" title="Monochrome (Default)">
    <span class="palette-dot palette-dot--monochrome"></span>
  </button>
  <button type="button" class="palette-dot-btn" data-palette-target="nord" aria-label="Nord Frost Palette" title="Nord Frost">
    <span class="palette-dot palette-dot--nord"></span>
  </button>
  <button type="button" class="palette-dot-btn" data-palette-target="warm-amber" aria-label="Warm Amber Palette" title="Warm Amber">
    <span class="palette-dot palette-dot--warm-amber"></span>
  </button>
  <button type="button" class="palette-dot-btn" data-palette-target="orange" aria-label="Orange Palette" title="Original Orange">
    <span class="palette-dot palette-dot--orange"></span>
  </button>
</div>
