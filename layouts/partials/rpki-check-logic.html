<div class="rpki-results">
    <div class="rpki-valid-row">
        <div class="rpki-cmd">$ fetch https://valid.rpki.isbgpsafeyet.com</div>
        <div class="rpki-valid-detail rpki-detail">... loading ...</div>
    </div>
    <div class="rpki-invalid-row" style="margin-top: 0.85rem;">
        <div class="rpki-cmd">$ fetch https://invalid.rpki.isbgpsafeyet.com/</div>
        <div class="rpki-invalid-detail rpki-detail">... loading ...</div>
    </div>
</div>
<div class="rpki-summary"></div>

<style>
.rpki-results {
    font-family: var(--font-mono, monospace);
    font-size: 0.9rem;
    background-color: #141622;
    border: 1.5px solid #313244;
    padding: 1rem 1.25rem;
    border-radius: 8px;
    color: #cdd6f4;
    line-height: 1.55;
}
[data-theme="light"] .rpki-results {
    background-color: #fbf5e8;
    border-color: #c7b89c;
    color: #141a2e;
}
.rpki-cmd {
    font-weight: 600;
}
.rpki-detail {
    margin-left: 2ch;
    color: #98add1;
}
[data-theme="light"] .rpki-detail {
    color: #525e82;
}
.rpki-detail.is-ok,
.rpki-summary.is-ok {
    color: #10b981;
}
[data-theme="light"] .rpki-detail.is-ok,
[data-theme="light"] .rpki-summary.is-ok {
    color: #047857;
}
.rpki-detail.is-bad,
.rpki-summary.is-bad {
    color: #f43f5e;
}
[data-theme="light"] .rpki-detail.is-bad,
[data-theme="light"] .rpki-summary.is-bad {
    color: #be123c;
}
.rpki-detail.is-warn,
.rpki-summary.is-warn {
    color: #f59e0b;
}
[data-theme="light"] .rpki-detail.is-warn,
[data-theme="light"] .rpki-summary.is-warn {
    color: #b45309;
}
.rpki-summary {
    margin-top: 1rem;
    font-weight: 700;
}
</style>

<script>
(function() {
    const container = document.currentScript.parentElement;
    const validDetail = container.querySelector('.rpki-valid-detail');
    const invalidDetail = container.querySelector('.rpki-invalid-detail');
    const summaryEl = container.querySelector('.rpki-summary');

    const validUrl = 'https://valid.rpki.isbgpsafeyet.com';
    const invalidUrl = 'https://invalid.rpki.isbgpsafeyet.com/';

    async function checkRpki(url, detailEl, expected) {
        try {
            const response = await fetch(url, { mode: 'cors', cache: 'no-cache' });
            if (response.ok) {
                const data = await response.json();
                if (expected === 'valid') {
                    detailEl.textContent = '✓ correctly accepted valid prefixes';
                    detailEl.classList.add('is-ok');
                } else {
                    detailEl.textContent = '✗ incorrectly accepted invalid prefixes';
                    detailEl.classList.add('is-bad');
                }
                return { success: true, data };
            } else {
                detailEl.textContent = '⚠ failed to reach prefix (status: ' + response.status + ')';
                detailEl.classList.add('is-warn');
                return { success: false };
            }
        } catch (e) {
            if (expected === 'invalid') {
                detailEl.textContent = '✓ correctly dropped invalid prefixes';
                detailEl.classList.add('is-ok');
            } else {
                detailEl.textContent = '✗ failed to reach valid prefixes (unstable connection?)';
                detailEl.classList.add('is-bad');
            }
            return { success: false, error: e };
        }
    }

    async function runCheck() {
        const [validRes, invalidRes] = await Promise.all([
            checkRpki(validUrl, validDetail, 'valid'),
            checkRpki(invalidUrl, invalidDetail, 'invalid')
        ]);

        let ispName = 'your ISP';
        if (validRes.success && validRes.data) {
            ispName = validRes.data.name || 'your ISP';
        }

        if (validRes.success && !invalidRes.success) {
            summaryEl.textContent = `✅ Your ISP, ${ispName}, is BGP safe! They are filtering RPKI-invalid routes.`;
            summaryEl.classList.add('is-ok');
        } else if (validRes.success && invalidRes.success) {
            summaryEl.textContent = `❌ Your ISP, ${ispName}, is NOT BGP safe. They are accepting RPKI-invalid routes.`;
            summaryEl.classList.add('is-bad');
        } else {
            summaryEl.textContent = '⚠️ Could not determine BGP safety status.';
            summaryEl.classList.add('is-warn');
        }
    }

    runCheck();
})();
</script>
