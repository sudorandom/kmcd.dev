ont-size="10.2" font-weight="700" fill="#111111">peer.ts</text></g><!-- FRONT CARD OF STACK: PLAIN GO STRUCT (peer.go) --><rect x="64" y="364" width="236" height="162" rx="8" fill="#111111"></rect><rect x="58" y="358" width="236" height="162" rx="8" fill="#FAF8F2" stroke="#111111" stroke-width="2.5"></rect><path d="M 58 366 Q 58 358 66 358 L 286 358 Q 294 358 294 366 L 294 392 L 58 392 Z" fill="#111111"></path><circle cx="76" cy="375" r="4.5" fill="#FF4F18"></circle><circle cx="91" cy="375" r="4.5" fill="#D4FF33"></circle><text x="107" y="380" font-family="IBM Plex Mono, monospace" font-size="13.5" font-weight="700" fill="#FAF8F2">peer.go</text><text x="282" y="379" text-anchor="end" font-family="IBM Plex Mono, monospace" font-size="10.5" font-weight="700" fill="#D4FF33">NO .PROTO</text><text x="72" y="422" font-family="IBM Plex Mono, monospace" font-size="13.5" font-weight="700" fill="#111111">type Peer struct &#123;</text><text y="449" font-family="IBM Plex Mono, monospace" font-size="13" fill="#111111"><tspan x="84">ID</tspan><tspan x="124" fill="#FF4F18" font-weight="700">uint32</tspan><tspan x="178">`omnibuf:"1"`</tspan></text><text y="476" font-family="IBM Plex Mono, monospace" font-size="13" fill="#111111"><tspan x="84">Host</tspan><tspan x="124" fill="#FF4F18" font-weight="700">string</tspan><tspan x="178">`omnibuf:"2"`</tspan></text><text x="72" y="503" font-family="IBM Plex Mono, monospace" font-size="13.5" font-weight="700" fill="#111111">&#125;</text><!-- ROUTING ARROWS (ZERO CROSSINGS) --><!-- Stem from peer.proto right edge (300, 98) to fork (330, 98) --><path d="M 300 98 L 330 98" fill="none" stroke="#111111" stroke-width="2.5"></path><!-- peer.proto -> Protobuf (y = 79) --><path d="M 330 98 L 330 91 Q 330 79 342 79 L 354 79" fill="none" stroke="#111111" stroke-width="2.5" stroke-dasharray="5 4"></path><polygon points="352,72 366,79 352,86" fill="#111111"></polygon><!-- peer.proto -> JSON (y = 259) --><path d="M 330 98 L 330 245 Q 330 259 344 259 L 354 259" fill="none" stroke="#111111" stroke-width="2.5" stroke-dasharray="5 4"></path><polygon points="352,252 366,259 352,266" fill="#111111"></polygon><!-- peer.proto -> OmniBuf upper entry (y = 422) --><path d="M 330 259 L 330 408 Q 330 422 344 422 L 352 422" fill="none" stroke="#FF4F18" stroke-width="3.5"></path><polygon points="350,414 366,422 350,430" fill="#FF4F18"></polygon><circle cx="330" cy="98" r="4.5" fill="#111111"></circle><circle cx="330" cy="259" r="4" fill="#111111"></circle><!-- peer.go -> OmniBuf ONLY (straight horizontal at y = 472) --><path d="M 300 472 L 352 472" fill="none" stroke="#FF4F18" stroke-width="3.5"></path><polygon points="350,464 366,472 350,480" fill="#FF4F18"></polygon><!-- OUTPUT 1: PROTOBUF --><rect x="374" y="24" width="470" height="122" rx="8" fill="#111111"></rect><rect x="368" y="18" width="470" height="122" rx="8" fill="#FAF8F2" stroke="#111111" stroke-width="2.5"></rect><text x="390" y="54" font-family="Space Grotesk, sans-serif" font-size="20" font-weight="700" fill="#111111">Protobuf Encoding</text><rect x="714" y="34" width="104" height="26" rx="4" fill="#E5E0D5" stroke="#111111" stroke-width="1.5"></rect><text x="766" y="51" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="12" font-weight="700" fill="#111111">STANDARD</text><text x="390" y="88" font-family="IBM Plex Mono, monospace" font-size="14" fill="#111111"><tspan fill="#00805A" font-weight="700">✓</tspan> Compact binary size</text><text x="390" y="116" font-family="IBM Plex Mono, monospace" font-size="14" fill="#111111"><tspan fill="#FF4F18" font-weight="700">✗</tspan> Needs schema to decode &amp; slow varints</text><!-- OUTPUT 2: JSON --><rect x="374" y="204" width="470" height="122" rx="8" fill="#111111"></rect><rect x="368" y="198" width="470" height="122" rx="8" fill="#FAF8F2" stroke="#111111" stroke-width="2.5"></rect><text x="390" y="234" font-family="Space Grotesk, sans-serif" font-size="20" font-weight="700" fill="#111111">JSON Encoding</text><rect x="658" y="214" width="160" height="26" rx="4" fill="#E5E0D5" stroke="#111111" stroke-width="1.5"></rect><text x="738" y="231" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="12" font-weight="700" fill="#111111">EASIER DEBUGGING</text><text x="390" y="268" font-family="IBM Plex Mono, monospace" font-size="14" fill="#111111"><tspan fill="#00805A" font-weight="700">✓</tspan> Easy to inspect without a schema</text><text x="390" y="296" font-family="IBM Plex Mono, monospace" font-size="14" fill="#111111"><tspan fill="#FF4F18" font-weight="700">✗</tspan> Bloated size &amp; slow text parsing</text><!-- OUTPUT 3: OMNIBUF --><rect x="374" y="384" width="470" height="142" rx="8" fill="#FF4F18"></rect><rect x="368" y="378" width="470" height="142" rx="8" fill="#111111" stroke="#111111" stroke-width="2.5"></rect><text x="390" y="416" font-family="Space Grotesk, sans-serif" font-size="20" font-weight="700" fill="#D4FF33">OmniBuf Encoding</text><rect x="628" y="396" width="190" height="26" rx="4" fill="#D4FF33"></rect><text x="723" y="413" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="12" font-weight="700" fill="#111111">SPEED + DEBUGGABILITY</text><text x="390" y="456" font-family="IBM Plex Mono, monospace" font-size="13.5" font-weight="600" fill="#FAF8F2"><tspan fill="#D4FF33" font-weight="700">✓</tspan> Works with .proto schemas or plain structs</text><text x="390" y="488" font-family="IBM Plex Mono, monospace" font-size="13.5" font-weight="600" fill="#FAF8F2"><tspan fill="#D4FF33" font-weight="700">✓</tspan> Readable without schema &amp; around 5x to 6x faster</text></svg>