<svg class="h3-diagram" viewBox="0 0 880 280" xmlns="http://www.w3.org/2000/svg" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
  <style>
    .h3-diagram {
      --bg-neutral: #1E1E2E;
      --c-border: #585B70;
      --text-main: #CDD6F4;
      --text-sub: #A6ADC8;
      --c-blue: #89B4FA;
      --bg-blue: #1E1E2E;
      --c-green: #A6E3A1;
      --bg-green: #1E1E2E;
      --c-purple: #CBA6F7;
      --bg-purple: #313244;
    }
    @media (prefers-color-scheme: light) {
      :root:not([data-theme="dark"]) .h3-diagram {
        --bg-neutral: #F6EFE0;
        --c-border: #475569;
        --text-main: #141A2E;
        --text-sub: #434E70;
        --c-blue: #0369A1;
        --bg-blue: #EDF6FF;
        --c-green: #0F766E;
        --bg-green: #E6F7F4;
        --c-purple: #6D28D9;
        --bg-purple: #F3E8FF;
      }
    }
    [data-theme="light"] .h3-diagram {
      --bg-neutral: #F6EFE0;
      --c-border: #475569;
      --text-main: #141A2E;
      --text-sub: #434E70;
      --c-blue: #0369A1;
      --bg-blue: #EDF6FF;
      --c-green: #0F766E;
      --bg-green: #E6F7F4;
      --c-purple: #6D28D9;
      --bg-purple: #F3E8FF;
    }
  </style>

  <defs>
    <marker id="h3s-arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="var(--c-purple)" />
    </marker>
    <marker id="h3s-arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="var(--c-green)" />
    </marker>
    <marker id="h3s-arr-green-rev" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto">
      <polygon points="8 0, 0 3, 8 6" fill="var(--c-green)" />
    </marker>
    <marker id="h3s-arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="var(--c-blue)" />
    </marker>
    <marker id="h3s-arr-blue-rev" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto">
      <polygon points="8 0, 0 3, 8 6" fill="var(--c-blue)" />
    </marker>
  </defs>

  <!-- Client Box -->
  <rect x="20" y="20" width="160" height="240" rx="10" fill="var(--bg-neutral)" stroke="var(--c-border)" stroke-width="2" />
  <text x="100" y="146" fill="var(--text-main)" font-size="18" font-weight="700" text-anchor="middle">Client</text>

  <!-- Server Box -->
  <rect x="700" y="20" width="160" height="240" rx="10" fill="var(--bg-neutral)" stroke="var(--c-border)" stroke-width="2" />
  <text x="780" y="136" fill="var(--text-main)" font-size="18" font-weight="700" text-anchor="middle">Server</text>
  <text x="780" y="160" fill="var(--text-sub)" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">http.Handler</text>

  <!-- Stream Lanes -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">
    <!-- Lane 1: Client Control -->
    <path d="M 192 58 L 686 58" fill="none" stroke="var(--c-purple)" stroke-width="2.5" stroke-dasharray="6,4" marker-end="url(#h3s-arr-purple)" />
    <rect x="295" y="38" width="290" height="32" rx="6" fill="var(--bg-purple)" stroke="var(--c-purple)" stroke-width="1.5" />
    <text x="440" y="59" fill="var(--c-purple)" font-weight="700" text-anchor="middle">Uni #2: Control (SETTINGS)</text>

    <!-- Lane 2: Server Control -->
    <path d="M 688 114 L 194 114" fill="none" stroke="var(--c-purple)" stroke-width="2.5" stroke-dasharray="6,4" marker-end="url(#h3s-arr-purple)" />
    <rect x="295" y="94" width="290" height="32" rx="6" fill="var(--bg-purple)" stroke="var(--c-purple)" stroke-width="1.5" />
    <text x="440" y="115" fill="var(--c-purple)" font-weight="700" text-anchor="middle">Uni #3: Control (SETTINGS)</text>

    <!-- Lane 3: Request 0 -->
    <path d="M 194 176 L 686 176" fill="none" stroke="var(--c-green)" stroke-width="2.5" marker-start="url(#h3s-arr-green-rev)" marker-end="url(#h3s-arr-green)" />
    <rect x="280" y="156" width="320" height="32" rx="6" fill="var(--bg-green)" stroke="var(--c-green)" stroke-width="1.5" />
    <text x="440" y="177" fill="var(--c-green)" font-weight="700" text-anchor="middle">Bidi #0: GET / (HEADERS + DATA)</text>

    <!-- Lane 4: Request 4 -->
    <path d="M 194 230 L 686 230" fill="none" stroke="var(--c-blue)" stroke-width="2.5" marker-start="url(#h3s-arr-blue-rev)" marker-end="url(#h3s-arr-blue)" />
    <rect x="280" y="210" width="320" height="32" rx="6" fill="var(--bg-blue)" stroke="var(--c-blue)" stroke-width="1.5" />
    <text x="440" y="231" fill="var(--c-blue)" font-weight="700" text-anchor="middle">Bidi #4: POST /echo (HEADERS + DATA)</text>
  </g>
</svg>
