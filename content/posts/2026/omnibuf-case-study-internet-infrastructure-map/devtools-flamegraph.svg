<svg class="ob-perf-diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 492" role="img" aria-label="Main-thread flamechart and V8 JS heap comparison between GeoJSON and OmniBuf under 4x CPU slowdown">
  <style>
    .ob-perf-diagram {
      font-family: var(--font-mono, ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace);
      --bg-track: #111827;
      --border: #334155;
      --grid: rgba(148, 163, 184, 0.18);
      --divider: rgba(248, 250, 252, 0.18);
      --ink: #f8fafc;
      --muted: #cbd5e1;
      --subtle: #94a3b8;

      --bar-ink: #ffffff;
      --json-accent: #fb923c;
      --json-bar-1: #9a3412;
      --json-bar-2: #c2410c;
      --json-bar-3: #b45309;
      --json-bar-4: #92400e;
      --json-fill: rgba(251, 146, 60, 0.20);

      --danger: #b91c1c;
      --danger-line: #f87171;
      --danger-text: #fca5a5;

      --omni-accent: #2dd4bf;
      --omni-bar-1: #075985;
      --omni-bar-2: #0369a1;
      --omni-bar-3: #0f766e;
      --omni-bar-4: #0e7490;
      --omni-fill: rgba(45, 212, 191, 0.18);
    }

    @media (prefers-color-scheme: light) {
      :root:not([data-theme="dark"]) .ob-perf-diagram {
        --bg-track: #f4f1ea;
        --border: #c7c0b2;
        --grid: rgba(17, 17, 17, 0.10);
        --divider: rgba(17, 17, 17, 0.18);
        --ink: #111111;
        --muted: #334155;
        --subtle: #475569;

        --bar-ink: #ffffff;
        --json-accent: #c2410c;
        --json-bar-1: #9a3412;
        --json-bar-2: #c2410c;
        --json-bar-3: #b45309;
        --json-bar-4: #92400e;
        --json-fill: rgba(194, 65, 12, 0.15);

        --danger: #b91c1c;
        --danger-line: #dc2626;
        --danger-text: #b91c1c;

        --omni-accent: #0f766e;
        --omni-bar-1: #075985;
        --omni-bar-2: #0369a1;
        --omni-bar-3: #0f766e;
        --omni-bar-4: #0e7490;
        --omni-fill: rgba(15, 118, 110, 0.15);
      }
    }

    [data-theme="light"] .ob-perf-diagram {
      --bg-track: #f4f1ea;
      --border: #c7c0b2;
      --grid: rgba(17, 17, 17, 0.10);
      --divider: rgba(17, 17, 17, 0.18);
      --ink: #111111;
      --muted: #334155;
      --subtle: #475569;

      --bar-ink: #ffffff;
      --json-accent: #c2410c;
      --json-bar-1: #9a3412;
      --json-bar-2: #c2410c;
      --json-bar-3: #b45309;
      --json-bar-4: #92400e;
      --json-fill: rgba(194, 65, 12, 0.15);

      --danger: #b91c1c;
      --danger-line: #dc2626;
      --danger-text: #b91c1c;

      --omni-accent: #0f766e;
      --omni-bar-1: #075985;
      --omni-bar-2: #0369a1;
      --omni-bar-3: #0f766e;
      --omni-bar-4: #0e7490;
      --omni-fill: rgba(15, 118, 110, 0.15);
    }
  </style>

  <defs>
    <pattern id="long-task-stripe" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="var(--danger)"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#ffffff" stroke-opacity="0.18" stroke-width="3"/>
    </pattern>
  </defs>

  <!-- Timeline ruler (x=16 is 0 ms, 11 px per ms -> 75 ms is x=841) -->
  <line x1="16" y1="24" x2="841" y2="24" stroke="var(--border)" stroke-width="1"/>
  <g font-size="11" font-weight="600" fill="var(--subtle)">
    <text x="16" y="17">0 ms</text>
    <text x="181" y="17" text-anchor="middle">15 ms</text>
    <text x="346" y="17" text-anchor="middle">30 ms</text>
    <text x="511" y="17" text-anchor="middle">45 ms</text>
    <text x="676" y="17" text-anchor="middle">60 ms</text>
    <text x="841" y="17" text-anchor="end">75 ms</text>
  </g>

  <!-- Vertical timeline gridlines -->
  <g stroke="var(--grid)" stroke-width="1">
    <line x1="16" y1="24" x2="16" y2="478"/>
    <line x1="181" y1="24" x2="181" y2="478"/>
    <line x1="346" y1="24" x2="346" y2="478"/>
    <line x1="511" y1="24" x2="511" y2="478"/>
    <line x1="676" y1="24" x2="676" y2="478"/>
    <line x1="841" y1="24" x2="841" y2="478"/>
  </g>

  <!-- 50 ms Long Task threshold line (x = 16 + 50*11 = 566) -->
  <line x1="566" y1="24" x2="566" y2="478" stroke="var(--danger-line)" stroke-opacity="0.7" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="573" y="42" font-size="10.5" font-weight="700" fill="var(--danger-text)">50 ms Long Task</text>

  <!-- ======================================================================= -->
  <!-- TRACK 1: GEOJSON                                                        -->
  <!-- ======================================================================= -->
  <text x="16" y="46" font-size="13" font-weight="700" fill="var(--json-accent)">GEOJSON</text>

  <!-- Flamechart Row 0: Task (69.6 ms -> 765.6 px: 550px normal + 215.6px Long Task) -->
  <rect x="16" y="56" width="550" height="26" rx="3" fill="var(--json-bar-1)"/>
  <rect x="566" y="56" width="215.6" height="26" rx="3" fill="url(#long-task-stripe)"/>
  <text x="26" y="73" font-size="11" font-weight="700" fill="var(--bar-ink)">Task (69.6 ms)</text>
  <text x="576" y="73" font-size="10.5" font-weight="700" fill="var(--bar-ink)">Long Task (+19.6 ms)</text>

  <!-- Flamechart Row 1: all_cables.json (53.6 ms -> 589.6 px) + globe-data.json (16.0 ms -> 176 px) -->
  <rect x="16" y="86" width="588.6" height="26" rx="3" fill="var(--json-bar-2)"/>
  <text x="26" y="103" font-size="10.5" font-weight="600" fill="var(--bar-ink)">Response.json(): all_cables.json (53.6 ms)</text>

  <rect x="606.6" y="86" width="175" height="26" rx="3" fill="var(--json-bar-3)"/>
  <text x="615" y="103" font-size="10" font-weight="600" fill="var(--bar-ink)">globe-data (16.0 ms)</text>

  <!-- Flamechart Row 2: V8 sub-phases -->
  <rect x="16" y="116" width="125.5" height="24" rx="3" fill="var(--json-bar-4)"/>
  <text x="25" y="132" font-size="10" font-weight="600" fill="var(--bar-ink)">UTF-8 decode</text>

  <rect x="143.5" y="116" width="356.6" height="24" rx="3" fill="var(--json-bar-3)"/>
  <text x="153" y="132" font-size="10" font-weight="600" fill="var(--bar-ink)">V8 JSON.parse (101k coordinate arrays)</text>

  <rect x="502.1" y="116" width="102.5" height="24" rx="3" fill="var(--danger)"/>
  <text x="553.3" y="132" text-anchor="middle" font-size="10" font-weight="700" fill="var(--bar-ink)">Minor GC</text>

  <rect x="606.6" y="116" width="175" height="24" rx="3" fill="var(--json-bar-4)"/>
  <text x="615" y="132" font-size="10" font-weight="600" fill="var(--bar-ink)">V8 JSON.parse</text>

  <!-- JS Heap Plot (GeoJSON) — Shared 0..12 MB vertical scale: y=240 is 0 MB, y=168 is 12 MB (6 px/MB) -->
  <rect x="16" y="148" width="825" height="96" rx="5" fill="var(--bg-track)" stroke="var(--border)" stroke-width="1"/>
  <line x1="16" y1="168" x2="841" y2="168" stroke="var(--grid)" stroke-width="1" stroke-dasharray="2 3"/>
  <line x1="16" y1="204" x2="841" y2="204" stroke="var(--grid)" stroke-width="1" stroke-dasharray="2 3"/>
  <text x="26" y="164" font-size="10" font-weight="600" fill="var(--muted)">JS Heap (12 MB)</text>
  <text x="26" y="200" font-size="10" fill="var(--subtle)">6 MB</text>

  <!-- Curve: 0 MB (240) -> 11.4 MB peak at x=502 (y=171.6) -> GC drop to 9.4 MB at x=553 (y=183.6) -> 10.8 MB retained at x=782 (y=175.2) -->
  <path d="M 16 238 L 143 220 L 346 190 L 502 172 L 553 184 L 606 184 L 725 177 L 782 175 L 841 175 L 841 244 L 16 244 Z" fill="var(--json-fill)"/>
  <path d="M 16 238 L 143 220 L 346 190 L 502 172 L 553 184 L 606 184 L 725 177 L 782 175 L 841 175" fill="none" stroke="var(--json-accent)" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="502" cy="172" r="4" fill="var(--json-accent)"/>

  <text x="492" y="164" text-anchor="end" font-size="10.5" font-weight="700" fill="var(--json-accent)">Peak: 11.4 MB</text>
  <text x="830" y="198" text-anchor="end" font-size="10.5" font-weight="700" fill="var(--ink)">Retained: 10.8 MB</text>

  <!-- Section Divider -->
  <line x1="16" y1="262" x2="841" y2="262" stroke="var(--divider)" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- ======================================================================= -->
  <!-- TRACK 2: OMNIBUF                                                        -->
  <!-- ======================================================================= -->
  <text x="16" y="286" font-size="13" font-weight="700" fill="var(--omni-accent)">OMNIBUF</text>

  <!-- Flamechart Row 0: Task (18.1 ms -> 199.1 px) -->
  <rect x="16" y="296" width="199.1" height="26" rx="3" fill="var(--omni-bar-1)"/>
  <text x="26" y="313" font-size="11" font-weight="700" fill="var(--bar-ink)">Task (18.1 ms)</text>

  <!-- Flamechart Row 1: all_cables.obuf (13.2 ms -> 145.2 px) + globe-data.obuf (4.9 ms -> 53.9 px) -->
  <rect x="16" y="326" width="144.2" height="26" rx="3" fill="var(--omni-bar-2)"/>
  <text x="25" y="343" font-size="10" font-weight="600" fill="var(--bar-ink)">all_cables (13.2 ms)</text>

  <rect x="162.2" y="326" width="52.9" height="26" rx="3" fill="var(--omni-bar-3)"/>

  <!-- Flamechart Row 2: TypedArray unpack & delta decode -->
  <rect x="16" y="356" width="144.2" height="24" rx="3" fill="var(--omni-bar-4)"/>
  <text x="25" y="372" font-size="10" font-weight="600" fill="var(--bar-ink)">Columnar unpack</text>

  <rect x="162.2" y="356" width="52.9" height="24" rx="3" fill="var(--omni-bar-3)"/>

  <!-- JS Heap Plot (OmniBuf) — Same 0..12 MB vertical scale: y=480 is 0 MB, y=408 is 12 MB (6 px/MB) -->
  <rect x="16" y="388" width="825" height="96" rx="5" fill="var(--bg-track)" stroke="var(--border)" stroke-width="1"/>
  <line x1="16" y1="408" x2="841" y2="408" stroke="var(--grid)" stroke-width="1" stroke-dasharray="2 3"/>
  <line x1="16" y1="444" x2="841" y2="444" stroke="var(--grid)" stroke-width="1" stroke-dasharray="2 3"/>
  <text x="26" y="404" font-size="10" font-weight="600" fill="var(--muted)">JS Heap (12 MB)</text>
  <text x="26" y="440" font-size="10" fill="var(--subtle)">6 MB</text>

  <!-- Curve: 0 MB (480) -> 4.7 MB retained at x=215 (y = 480 - 4.7*6 = 451.8) -->
  <path d="M 16 478 L 90 464 L 161 455 L 215 452 L 841 452 L 841 484 L 16 484 Z" fill="var(--omni-fill)"/>
  <path d="M 16 478 L 90 464 L 161 455 L 215 452 L 841 452" fill="none" stroke="var(--omni-accent)" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="215" cy="452" r="4" fill="var(--omni-accent)"/>

  <text x="228" y="432" font-size="10.5" font-weight="700" fill="var(--omni-accent)">Retained: 4.7 MB</text>
</svg>
