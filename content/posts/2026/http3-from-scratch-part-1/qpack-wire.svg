<svg class="h3-diagram" viewBox="0 0 880 124" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <style>
    .h3-diagram {
      --text-main: #CDD6F4;
      --text-sub: #A6ADC8;
      --c-blue: #89B4FA;
      --bg-blue: #1E1E2E;
      --c-green: #A6E3A1;
      --bg-green: #1E1E2E;
      --c-purple: #CBA6F7;
      --bg-purple: #1E1E2E;
    }
    @media (prefers-color-scheme: light) {
      :root:not([data-theme="dark"]) .h3-diagram {
        --text-main: #141A2E;
        --text-sub: #434E70;
        --c-blue: #0369A1;
        --bg-blue: #EDF6FF;
        --c-green: #0F766E;
        --bg-green: #E6F7F4;
        --c-purple: #6D28D9;
        --bg-purple: #F3E8FF;
      }
    }
    [data-theme="light"] .h3-diagram {
      --text-main: #141A2E;
      --text-sub: #434E70;
      --c-blue: #0369A1;
      --bg-blue: #EDF6FF;
      --c-green: #0F766E;
      --bg-green: #E6F7F4;
      --c-purple: #6D28D9;
      --bg-purple: #F3E8FF;
    }
  </style>

  <!-- Prefix -->
  <rect x="20" y="20" width="210" height="84" rx="8" fill="var(--bg-purple)" stroke="var(--c-purple)" stroke-width="2" />
  <text x="125" y="48" fill="var(--c-purple)" font-size="16" font-weight="700" text-anchor="middle">0x00   0x00</text>
  <text x="125" y="72" fill="var(--text-main)" font-size="13" font-weight="600" text-anchor="middle">2-Byte Prefix</text>
  <text x="125" y="91" fill="var(--text-sub)" font-size="11" text-anchor="middle">Static Mode</text>

  <!-- Indexed -->
  <rect x="244" y="20" width="190" height="84" rx="8" fill="var(--bg-green)" stroke="var(--c-green)" stroke-width="2" />
  <text x="339" y="48" fill="var(--c-green)" font-size="16" font-weight="700" text-anchor="middle">0xd1</text>
  <text x="339" y="72" fill="var(--text-main)" font-size="13" font-weight="600" text-anchor="middle">Indexed (#17)</text>
  <text x="339" y="91" fill="var(--text-sub)" font-size="11" text-anchor="middle">:method: GET</text>

  <!-- Indexed 2 -->
  <rect x="448" y="20" width="170" height="84" rx="8" fill="var(--bg-green)" stroke="var(--c-green)" stroke-width="2" />
  <text x="533" y="48" fill="var(--c-green)" font-size="16" font-weight="700" text-anchor="middle">0xc1</text>
  <text x="533" y="72" fill="var(--text-main)" font-size="13" font-weight="600" text-anchor="middle">Indexed (#1)</text>
  <text x="533" y="91" fill="var(--text-sub)" font-size="11" text-anchor="middle">:path: /</text>

  <!-- Literal -->
  <rect x="632" y="20" width="228" height="84" rx="8" fill="var(--bg-blue)" stroke="var(--c-blue)" stroke-width="2" />
  <text x="746" y="48" fill="var(--c-blue)" font-size="16" font-weight="700" text-anchor="middle">0x50 0x08 "kmcd.dev"</text>
  <text x="746" y="72" fill="var(--text-main)" font-size="13" font-weight="600" text-anchor="middle">Name Ref (#0) + Literal</text>
  <text x="746" y="91" fill="var(--text-sub)" font-size="11" text-anchor="middle">:authority</text>
</svg>
