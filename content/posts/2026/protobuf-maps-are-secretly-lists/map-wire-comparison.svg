<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" width="760" height="280" role="img" aria-label="Proportional byte layout of a 5-entry map in Protobuf versus OmniBuf">
  <style>
    .bg { fill: #0f141e; }
    .heading { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 700; fill: #f1f5f9; }
    .legend { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; font-size: 12px; fill: #94a3b8; }
    .lbl { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10.5px; font-weight: 600; text-anchor: middle; }
    .frame { fill: #7f1d1d; stroke: #ef4444; stroke-width: 1; rx: 3; }
    .frame-txt { fill: #fecaca; }
    .key { fill: #0c4a6e; stroke: #38bdf8; stroke-width: 1; rx: 3; }
    .key-txt { fill: #e0f2fe; }
    .val { fill: #14532d; stroke: #4ade80; stroke-width: 1; rx: 3; }
    .val-txt { fill: #dcfce7; }
    .sep { stroke: #1e293b; stroke-width: 1; }
  </style>

  <rect width="760" height="280" class="bg" rx="10" />

  <!-- Minimal legend -->
  <g transform="translate(24, 18)">
    <rect x="0" y="0" width="12" height="12" class="frame" />
    <text x="18" y="10" class="legend">Framing</text>
    <rect x="92" y="0" width="12" height="12" class="key" />
    <text x="110" y="10" class="legend">Key</text>
    <rect x="156" y="0" width="12" height="12" class="val" />
    <text x="174" y="10" class="legend">Value</text>
  </g>

  <!-- Protobuf: 15px per byte -> 46B total (5 rows, aligned cleanly) -->
  <text x="24" y="56" class="heading">Protobuf</text>
  <g transform="translate(24, 66)">
    <!-- Entry 1: 3B frame, 4B key, 1B frame, 1B val (9B) -->
    <rect x="0" y="0" width="44" height="24" class="frame" /><text x="22" y="16" class="lbl frame-txt">3B</text>
    <rect x="46" y="0" width="60" height="24" class="key" /><text x="76" y="16" class="lbl key-txt">"fra"</text>
    <rect x="108" y="0" width="24" height="24" class="frame" /><text x="120" y="16" class="lbl frame-txt">1B</text>
    <rect x="134" y="0" width="26" height="24" class="val" /><text x="147" y="16" class="lbl val-txt">12</text>

    <!-- Entry 2 -->
    <rect x="168" y="0" width="44" height="24" class="frame" /><text x="190" y="16" class="lbl frame-txt">3B</text>
    <rect x="214" y="0" width="60" height="24" class="key" /><text x="244" y="16" class="lbl key-txt">"ams"</text>
    <rect x="276" y="0" width="24" height="24" class="frame" /><text x="288" y="16" class="lbl frame-txt">1B</text>
    <rect x="302" y="0" width="26" height="24" class="val" /><text x="315" y="16" class="lbl val-txt">8</text>

    <!-- Entry 3 -->
    <rect x="336" y="0" width="44" height="24" class="frame" /><text x="358" y="16" class="lbl frame-txt">3B</text>
    <rect x="382" y="0" width="60" height="24" class="key" /><text x="412" y="16" class="lbl key-txt">"iad"</text>
    <rect x="444" y="0" width="24" height="24" class="frame" /><text x="456" y="16" class="lbl frame-txt">1B</text>
    <rect x="470" y="0" width="26" height="24" class="val" /><text x="483" y="16" class="lbl val-txt">24</text>

    <!-- Entry 4 -->
    <rect x="504" y="0" width="44" height="24" class="frame" /><text x="526" y="16" class="lbl frame-txt">3B</text>
    <rect x="550" y="0" width="60" height="24" class="key" /><text x="580" y="16" class="lbl key-txt">"nrt"</text>
    <rect x="612" y="0" width="24" height="24" class="frame" /><text x="624" y="16" class="lbl frame-txt">1B</text>
    <rect x="638" y="0" width="26" height="24" class="val" /><text x="651" y="16" class="lbl val-txt">95</text>

    <!-- Entry 5 (wraps cleanly to second line) -->
    <rect x="0" y="32" width="44" height="24" class="frame" /><text x="22" y="48" class="lbl frame-txt">3B</text>
    <rect x="46" y="32" width="60" height="24" class="key" /><text x="76" y="48" class="lbl key-txt">"syd"</text>
    <rect x="108" y="32" width="24" height="24" class="frame" /><text x="120" y="48" class="lbl frame-txt">1B</text>
    <rect x="134" y="32" width="38" height="24" class="val" /><text x="153" y="48" class="lbl val-txt">142</text>
  </g>

  <line x1="24" y1="146" x2="736" y2="146" class="sep" />

  <!-- OmniBuf: 1 single 5B header + 5 packed key/value pairs -->
  <text x="24" y="176" class="heading">OmniBuf</text>
  <g transform="translate(24, 186)">
    <rect x="0" y="0" width="80" height="24" class="frame" /><text x="40" y="16" class="lbl frame-txt">5B header</text>

    <rect x="88" y="0" width="64" height="24" class="key" /><text x="120" y="16" class="lbl key-txt">"fra"</text>
    <rect x="154" y="0" width="26" height="24" class="val" /><text x="167" y="16" class="lbl val-txt">12</text>

    <rect x="188" y="0" width="64" height="24" class="key" /><text x="220" y="16" class="lbl key-txt">"ams"</text>
    <rect x="254" y="0" width="26" height="24" class="val" /><text x="267" y="16" class="lbl val-txt">8</text>

    <rect x="288" y="0" width="64" height="24" class="key" /><text x="320" y="16" class="lbl key-txt">"iad"</text>
    <rect x="354" y="0" width="26" height="24" class="val" /><text x="367" y="16" class="lbl val-txt">24</text>

    <rect x="388" y="0" width="64" height="24" class="key" /><text x="420" y="16" class="lbl key-txt">"nrt"</text>
    <rect x="454" y="0" width="26" height="24" class="val" /><text x="467" y="16" class="lbl val-txt">95</text>

    <rect x="488" y="0" width="64" height="24" class="key" /><text x="520" y="16" class="lbl key-txt">"syd"</text>
    <rect x="554" y="0" width="38" height="24" class="val" /><text x="573" y="16" class="lbl val-txt">142</text>
  </g>
</svg>
